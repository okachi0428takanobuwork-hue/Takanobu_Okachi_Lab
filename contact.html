<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="生徒会DX研究室へのお問い合わせフォームです。">
    <title>お問い合わせ | 生徒会DX研究室</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="site-logo" href="index.html">
                生徒会DX研究室
            </a>

            <nav aria-label="メインナビゲーション">
                <a href="index.html#about">プロフィール</a>
                <a href="index.html#research">研究・実践</a>
                <a href="contact.html">お問い合わせ</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="contact-hero">
            <div class="container">
                <p class="eyebrow">Contact</p>
                <h1>お問い合わせ</h1>
                <p>
                    生徒会活動のDX・ICT活用に関するご質問、
                    ご意見、ご感想などをお寄せください。
                </p>
            </div>
        </section>

        <section class="section container">
            <div class="contact-panel">

                <div class="contact-heading">
                    <p class="eyebrow">Contact Form</p>
                    <h2>お問い合わせフォーム</h2>
                    <p>
                        以下の項目にご入力ください。
                        お名前とメールアドレスは任意です。
                    </p>
                </div>

                <!-- 現段階では送信処理は未接続 -->
                <form class="contact-form" id="contact-form"
                    action="https://docs.google.com/forms/d/e/1FAIpQLScVBhijayAyPF7meHgj0rijzVcwLtqWdhRcSPtuYpdZZV0WeA/formResponse"
                    method="POST" target="google-form-response">

                    <div class="form-group">
                        <label for="contact-type">
                            お問い合わせの種類
                            <span class="required">必須</span>
                        </label>

                        <select id="contact-type" name="entry.831194899" required>
                            <option value="">選択してください</option>
                            <option value="当サイトに関するお問い合わせ">
                                当サイトに関するお問い合わせ
                            </option>
                            <option value="生徒会活動のDXに関するお問い合わせ">
                                生徒会活動のDXに関するお問い合わせ
                            </option>
                            <option value="研究・実践に関するお問い合わせ">
                                研究・実践に関するお問い合わせ
                            </option>
                            <option value="研修会・勉強会等の講師依頼">
                                研修会・勉強会等の講師依頼
                            </option>
                            <option value="その他のお問合せ">
                                その他のお問合せ
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="contact-name">
                            お名前 <span class="required">必須</span </label>
                            <input type="text" id="contact-name" name="entry.1119348703" autocomplete="name"
                                placeholder="お名前をご入力ください">
                    </div>

                    <div class="form-group">
                        <label for="contact-email">
                            メールアドレス <span class="required">必須</span>
                        </label>
                        <input type="email" id="contact-email" name="entry.990362124" autocomplete="email"
                            placeholder="example@example.com">
                    </div>

                    <div class="form-group">
                        <label for="contact-message">
                            お問い合わせ内容 <span class="required">必須</span>
                        </label>
                        <textarea id="contact-message" name="entry.416376702" rows="8" required
                            placeholder="お問い合わせ内容をご入力ください"></textarea>
                    </div>

                    <p class="form-note">
                        ※個人情報や機密情報は入力しないでください。
                    </p>

                    <div class="form-submit">
                        <button type="submit" class="button">
                            内容を送信する →
                        </button>
                    </div>

                    <p id="form-status" class="form-note" role="status" aria-live="polite"></p>
                </form>

                <iframe name="google-form-response" id="google-form-response" title="Googleフォーム送信結果" hidden>
                </iframe>

                <script>
                    const contactForm = document.getElementById("contact-form");
                    const formStatus = document.getElementById("form-status");
                    const responseFrame = document.getElementById("google-form-response");

                    let submitting = false;

                    contactForm.addEventListener("submit", function () {
                        submitting = true;
                        formStatus.textContent = "送信処理中です。しばらくお待ちください。";
                    });

                    responseFrame.addEventListener("load", function () {
                        if (submitting) {
                            formStatus.textContent =
                                "送信リクエストを送信しました。回答が記録されたか、Googleフォームの回答画面で確認してください。";
                            submitting = false;
                        }
                    });
                </script>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>生徒会DX研究室</p>
            <p>&copy; 2026 Takanobu Okachi</p>
        </div>
    </footer>
</body>

</html>
